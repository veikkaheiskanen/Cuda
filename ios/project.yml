name: Cuda
options:
  bundleIdPrefix: com.veikkaheiskanen
  deploymentTarget:
    iOS: '17.0'
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk.git
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGN_STYLE: Automatic
targets:
  Cuda:
    type: application
    platform: iOS
    sources: [Cuda/Sources, Cuda/Resources, ../shared]
    dependencies:
      - package: SpotifyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veikkaheiskanen.Cuda
        INFOPLIST_FILE: Cuda/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: '$(inherited) -ObjC'
  CudaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CudaTests]
    dependencies: [{target: Cuda}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CudaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CudaUITests]
    dependencies: [{target: Cuda}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cuda:
    build:
      targets:
        Cuda: all
    test:
      targets: [CudaTests, CudaUITests]
