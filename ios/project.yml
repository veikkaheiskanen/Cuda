name: Cuda
options:
  bundleIdPrefix: com.veikkaheiskanen
  deploymentTarget:
    iOS: '17.0'
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk.git
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1.5'
    CURRENT_PROJECT_VERSION: '8'
    CODE_SIGN_STYLE: Automatic
targets:
  Cuda:
    type: application
    platform: iOS
    sources:
      - Cuda/Sources
      - path: Cuda/Resources
        excludes: [Assets.xcassets/AppIcon.appiconset]
      - ../shared/GenreSelector.swift
      - ../shared/GenreCatalog.swift
      - ../shared/StreamingPreferences.swift
      - ../shared/GitHubUpdates.swift
      - ../shared/SyncState.swift
      - ../shared/OfflinePlaylistState.swift
      - path: ../assets/Cuda.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: SpotifyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veikkaheiskanen.Cuda
        INFOPLIST_FILE: Cuda/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: Cuda
        OTHER_LDFLAGS: '$(inherited) -ObjC'
  CudaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CudaTests]
    dependencies: [{target: Cuda}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CudaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CudaUITests]
    dependencies: [{target: Cuda}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cuda:
    build:
      targets:
        Cuda: all
    test:
      targets: [CudaTests, CudaUITests]
