[package]
name = "riff-spotify-player"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
soundtouch = "=0.5.4"
