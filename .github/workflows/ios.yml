name: iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'shared/**', 'macos/shelf-sync.js', 'macos/mobile-companion.js', 'test/shelf-sync.test.js', 'test/mobile-companion.test.js', 'scripts/ios-bridge.js', 'test/ios-bridge.test.js', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'shared/**', 'macos/shelf-sync.js', 'macos/mobile-companion.js', 'test/shelf-sync.test.js', 'test/mobile-companion.test.js', 'scripts/ios-bridge.js', 'test/ios-bridge.test.js', '.github/workflows/ios.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify companion security and streaming
        run: node --test test/ios-bridge.test.js test/shelf-sync.test.js test/mobile-companion.test.js
      - name: Generate native project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild -version
      - name: Compile iPhone and iPad app
        run: |
          cd ios
          xcodebuild -project Cuda.xcodeproj -scheme Cuda -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1 || { tail -150 build-device.log; exit 1; }
          mkdir -p build/export/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Cuda.app build/export/Payload/
          cd build/export
          /usr/bin/ditto -c -k --keepParent Payload Cuda-1.1.4-ios-unsigned.ipa
          shasum -a 256 Cuda-1.1.4-ios-unsigned.ipa > SHA256SUMS.txt
      - name: Start isolated Mac sync fixture
        run: |
          node ios/scripts/sync-fixture.js > ios/build/sync-fixture.log 2>&1 &
          for attempt in {1..15}; do
            if test -s ios/CudaTests/SyncFixture.json && python3 -c 'import json; assert json.load(open("ios/CudaTests/SyncFixture.json")).get("link")' 2>/dev/null; then break; fi
            sleep 1
          done
          python3 -c 'import json; assert json.load(open("ios/CudaTests/SyncFixture.json")).get("link")'
          cd ios && xcodegen generate
      - name: Test native app on iPhone Simulator
        run: |
          cd ios
          xcrun simctl list devices available -j > build/devices.json
          PHONE=$(python3 -c 'import json; d=json.load(open("build/devices.json")); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "$PHONE" > build/phone-id
          xcrun simctl boot "$PHONE" || true
          xcrun simctl bootstatus "$PHONE" -b
          xcodebuild -project Cuda.xcodeproj -scheme Cuda -configuration Debug \
            -destination "platform=iOS Simulator,id=$PHONE" -derivedDataPath build/simulator \
            -parallel-testing-enabled NO -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test \
            2>&1 | tee build-simulator.log
      - name: Capture iPhone and iPad layouts
        run: bash ios/scripts/screenshots.sh
      - name: Upload IPA and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cuda-iOS
          path: |
            ios/build/export/*.ipa
            ios/build/export/SHA256SUMS.txt
            ios/build/screenshots/*.png
          if-no-files-found: error
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cuda-iOS-tests
          path: |
            ios/build/TestResults.xcresult
            ios/build-device.log
            ios/build-simulator.log
          if-no-files-found: error
